      (function () {
        var saved = localStorage.getItem("theme");
        var dark =
          saved === "dark" ||
          (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);        document.documentElement.classList.toggle("dark", dark);
      })();
